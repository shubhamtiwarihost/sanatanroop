name: Deploy Sanatan Dharma Platform to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build Next.js Static Export
        run: |
          npm run build
          cp public/.htaccess out/.htaccess

      - name: Deploy to Hostinger via FTP (Attempt 1)
        id: ftp_deploy_1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/sanatanroop.com/public_html/
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 600000

      - name: Wait before retry (Hostinger socket pool cooldown)
        if: steps.ftp_deploy_1.outcome == 'failure'
        run: sleep 20

      - name: Deploy to Hostinger via FTP (Attempt 2)
        id: ftp_deploy_2
        if: steps.ftp_deploy_1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        continue-on-error: true
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/sanatanroop.com/public_html/
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 600000

      - name: Wait before final retry
        if: steps.ftp_deploy_1.outcome == 'failure' && steps.ftp_deploy_2.outcome == 'failure'
        run: sleep 30

      - name: Deploy to Hostinger via FTP (Final Attempt)
        if: steps.ftp_deploy_1.outcome == 'failure' && steps.ftp_deploy_2.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /domains/sanatanroop.com/public_html/
          local-dir: ./out/
          dangerous-clean-slate: false
          timeout: 600000
